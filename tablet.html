<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }
        
        header {
            position: relative;
        }

        nav {
            height: 50px;
            width: 100%;
            position: relative;
            z-index: 20;
        }

        .icons {
            height: 50px;
            width: 150px;
            margin-left: 1245px;
            display: flex;
            gap: 29px;
        }

        .icons > img {
            height: 20px;
            width: 20px;
            margin-top: 16px;
        }

        .logo {
            height: 50px;
            width: 150px;
            margin-top: -50px;
            margin-left: 63px;
            background-image: url("https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQIkE_7_wVMSwhFASngd8iCz53gjxUCy2DQ7a1R3wQdnZKVF3bC");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .opt {
            height: 50px;
            width: 820px;
            margin-left: 321px;
            margin-top: -50px;
            display: flex;
            align-items: center;
        }
        
        .opt ul {
            display: flex;
            list-style: none;
            gap: 10px;
        }
        
        .opt ul li a {
            text-decoration: none;
            padding: 8px 16px;
            color: black;
            font-family: Arial, sans-serif;
            transition: color .3s ease;
            font-size: 14px;
        }

        
    .store{
    width:100%;
    min-height:100vh;
    display:flex;
    background:#fff;
}

.filters{
    width:300px;
    min-height:100vh;
    border-right:1px solid #e5e5e5;
    padding:35px 25px;
    position:sticky;
    top:0;
    background:white;
}

.products{
    flex:1;
    padding:30px;

}

.sort{
    width:100%;
    height:50px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-bottom:30px;
}

.sort select{
    border:none;
    font-size:18px;
    cursor:pointer;
    outline:none;
    background:white;
}

.cards{
    display:grid;
    grid-template-columns:
    repeat(3,1fr);
    gap:30px;
}

.card{
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:330px;
    object-fit:contain;
    background:#f8f8f8;
}

.card h2{
    font-size:34px;
    font-weight:400;
    margin-top:20px;
    font-family:Arial,sans-serif;

}

.discount{
    color:red;
    margin-top:8px;
}

.price{
    margin-top:15px;
    font-size:22px;

}
.oldPrice{
    color:gray;
    text-decoration:line-through;
    margin-left:10px;
}
    </style>
</head>
<body>
    <!-- navbar should be on every page -->
     <header>
    <nav>
        <div class="icons">
            <img src="search-interface-symbol.png" alt="">
            <img src="shopping-cart.png" alt="">
            <img src="user.png" alt="">
        </div>
        <div class="logo"></div>
        <div class="opt">
            <ul>
                <li><a href="#">Store</a></li>
                <li><a href="#">Phone</a></li>
                <li><a href="#">Tablet</a></li>
                <li><a href="#">Audio</a></li>
                <li><a href="#">More Products</a></li>
                <li><a href="#">OneTopia</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Support</a></li>
            </ul>
        </div>
    </nav>

    <!-- Dropdown content -->
    <div class="content">
        <h1></h1>
    </div>

</header>
    <div class="store">
    <aside class="filters">
        <h3>Offers</h3>
        <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
<span><label for="subscribe">On Sale</label> <p style="color: red;">new</p></span>
<!-- this i have tried ki image ki tarah ek line me aaye new and On Sale both, but somehow it is not happening -->
        <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
<label for="subscribe">With Gift</label> <p style="color: red;">new</p>

<br>
<h3>Categories</h3>
        <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
<span><label for="subscribe">Tablet</label> <p style="color: red;">new</p></span>
<!-- this i have tried ki image ki tarah ek line me aaye new and On Sale both, but somehow it is not happening -->
        <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
<label for="subscribe">Tablet Accessories</label> <p style="color: red;">new</p>

<br>
<h3>Availability</h3>
        <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
<span><label for="subscribe">In Stock</label> <p style="color: red;">new</p></span>

    </aside>
    <main class="products">
        <div class="sort"></div>
        <div class="cards"></div>
    </main>
</div>

<script>
        // For NAVBAR
            const menuItems = document.querySelectorAll(".opt li");
            const dropdown = document.querySelector(".content");
            const heading = document.querySelector(".content h1");
            const menuData = {
                Store:[
                    "Phones",
                    "Tablets",
                    "Audio",
                    "Accessories"
                ],
                Phone:[
                    "OnePlus 15",
                    "OnePlus 15R",
                    "Nord Series"
                ],
                Tablet:[
                    "OnePlus Pad",
                    "OnePlus Pad 2",
                    "OnePlus Pad Go"
                ],
                Audio:[
                    "Buds",
                    "Headphones"
                ],
                "More Products":[
                    "Watch",
                    "Keyboard",
                    "Charger",
                    "Cases"
                ],
                OneTopia:[
                    "Community",
                    "Events",
                    "Rewards"
                ],
                Community:[
                    "Forums",
                    "Events"
                ],
                Support:[
                    "Service Center",
                    "Services",
                    "Contact Us"
                ]
            };
            
            // initial hidden state

            dropdown.style.position="absolute";
            dropdown.style.top="50px";
            dropdown.style.left="0";
            dropdown.style.width="100%";
            dropdown.style.height="300px";
            dropdown.style.background="white";
            dropdown.style.transform="translateY(-100%)";
            dropdown.style.transition="0.5s ease";
            dropdown.style.zIndex="10";
            menuItems.forEach(item=>{
                item.addEventListener("mouseenter",()=>{
                    let name=item.innerText.trim();
                    heading.innerHTML="";
                    let ul=document.createElement("ul");
                    ul.style.display="flex";
                    ul.style.gap="40px";
                    ul.style.padding="40px";
                    menuData[name].forEach(product=>{
                        let li=document.createElement("li");
                        li.innerText=product;
                        li.style.listStyle="none";
                        li.style.fontSize="20px";
                        ul.appendChild(li);
                    });
                    heading.appendChild(ul);
                    dropdown.style.transform="translateY(0)";
                });
            });
            dropdown.addEventListener("mouseleave",()=>{
                dropdown.style.transform="translateY(-100%)";
            });
    const tablets = [

{
    name:"OnePlus Pad 4",
    price:59999,
    oldPrice:62999,
    discount:"4%",
    img:"pad4.png"
},

{
    name:"OnePlus Pad 4 Folio Case",
    price:2999,
    oldPrice:3999,
    discount:"25%",
    img:"folio.png"
},

{
    name:"OnePlus Stylo Pro",
    price:699,
    oldPrice:999,
    discount:"30%",
    img:"pen.png"
}

];

const cards = document.querySelector(".cards");
function displayProducts(data){
    cards.innerHTML = "";
    data.forEach((product)=>{
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <img src="${product.img}" alt="">
            <h2>${product.name}</h2>
            <p class="discount">${product.discount} off</p>
            <p class="price">
                ₹${product.price}
                <span class="oldPrice">
                    ₹${product.oldPrice}
                </span>

            </p>
        `;
                cards.appendChild(card);
    });
}
displayProducts(tablets);
</script>
</body>
</html>
